<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Điểm danh hội nghị</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 15px;

    background: #eef3f8;

    font-family: Arial, sans-serif;

    color: #222;

}

.container {

    width: 100%;

    max-width: 650px;

    margin: auto;

    background: white;

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

}

h1 {

    text-align: center;

    color: #1565c0;

    margin-top: 5px;

}

.thongTin {

    text-align: center;

    margin: 15px 0;

}

#maDaiBieu {

    color: #666;

    font-size: 15px;

}

video {

    width: 100%;

    max-height: 65vh;

    object-fit: cover;

    border-radius: 15px;

    background: #111;

    transform: scaleX(-1);

}

#anhPreview {

    width: 100%;

    border-radius: 15px;

    display: none;

}

button {

    width: 100%;

    padding: 16px;

    margin-top: 12px;

    border: none;

    border-radius: 10px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

#btnChup {

    background: #1565c0;

    color: white;

}

#btnGui {

    background: #16803c;

    color: white;

    display: none;

}

#btnChupLai {

    background: #777;

    color: white;

    display: none;

}

button:disabled {

    background: #999;

    cursor: not-allowed;

}

#trangThai {

    text-align: center;

    font-size: 17px;

    line-height: 1.6;

    margin-top: 15px;

}

.thanhCong {

    color: #16803c;

    font-weight: bold;

}

.loi {

    color: #d00000;

    font-weight: bold;

}

.thongBao {

    padding: 12px;

    border-radius: 10px;

    background: #f1f5f9;

    margin-top: 15px;

    text-align: center;

}

.hidden {

    display: none !important;

}


/*
==================================================
FORM GỬI ẢNH
==================================================
*/

#formGuiAnh {

    display: none;

}

#khungGui {

    display: none;

}

</style>

</head>


<body>


<div class="container">


<h1>
📋 ĐIỂM DANH HỘI NGHỊ
</h1>


<div class="thongTin">

    <div id="maDaiBieu">
        Mã đại biểu: đang tải...
    </div>

</div>


<div class="thongBao">

    📷 Camera trước đang được sử dụng

</div>


<!-- CAMERA -->

<video
id="camera"
autoplay
playsinline
muted>
</video>


<!-- ẢNH ĐÃ CHỤP -->

<img
id="anhPreview"
alt="Ảnh điểm danh">


<!-- NÚT CHỤP -->

<button
id="btnChup"
onclick="chupAnh()">

📸 CHỤP ẢNH ĐIỂM DANH

</button>


<!-- NÚT CHỤP LẠI -->

<button
id="btnChupLai"
onclick="chupLai()">

🔄 CHỤP LẠI

</button>


<!-- NÚT GỬI -->

<button
id="btnGui"
onclick="guiAnh()">

✅ XÁC NHẬN ĐIỂM DANH

</button>


<div id="trangThai">

⏳ Đang khởi động camera...

</div>


<!-- FORM CROSS ORIGIN -->

<form
id="formGuiAnh"
method="POST"
target="khungGui"
>

<input
type="hidden"
name="id"
id="inputId">

<input
type="hidden"
name="token"
id="inputToken">

<input
type="hidden"
name="anh"
id="inputAnh">

</form>


<iframe
name="khungGui"
id="khungGui"
style="display:none">
</iframe>


</div>


<script>


/*
==================================================
CẤU HÌNH
==================================================
*/

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS7bIBeGwpeKxGqGVIef9nG_dEcF-JjoqmfKl3TsCFCJqqz9mAaXADHqEbpQTnINwTGQ/exec";


/*
==================================================
LẤY ID + TOKEN
==================================================
*/

var params =
new URLSearchParams(
window.location.search
);


var id =
params.get("id");


var token =
params.get("token");


document.getElementById(
"maDaiBieu"
).innerText =
"Mã đại biểu: " +
(id || "KHÔNG CÓ");


/*
==================================================
BIẾN CAMERA
==================================================
*/

var camera =
document.getElementById("camera");


var anhPreview =
document.getElementById("anhPreview");


var btnChup =
document.getElementById("btnChup");


var btnGui =
document.getElementById("btnGui");


var btnChupLai =
document.getElementById("btnChupLai");


var trangThai =
document.getElementById("trangThai");


var inputId =
document.getElementById("inputId");


var inputToken =
document.getElementById("inputToken");


var inputAnh =
document.getElementById("inputAnh");


var stream =
null;


var anhBase64 =
null;


var daGui =
false;


/*
==================================================
KIỂM TRA ID + TOKEN
==================================================
*/

if (!id) {

    hienThiLoi(
        "❌ Không có mã đại biểu!"
    );

}
else if (!token) {

    hienThiLoi(
        "❌ Không có mã xác thực. Vui lòng quét QR lại!"
    );

}
else {

    inputId.value =
        id;

    inputToken.value =
        token;

    moCamera();

}


/*
==================================================
MỞ CAMERA
==================================================
*/

async function moCamera() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );

        }


        trangThai.innerHTML =
            "📷 Đang yêu cầu quyền camera...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        camera.srcObject =
            stream;


        await camera.play();


        trangThai.innerHTML =
            "🟢 Camera đã sẵn sàng. " +
            "Hãy nhìn vào camera rồi bấm CHỤP ẢNH.";


    }

    catch (error) {

        console.error(error);


        hienThiLoi(

            "❌ Không mở được camera." +

            "<br><br>" +

            "Hãy kiểm tra:" +

            "<br>1. Bạn đã cấp quyền camera chưa?" +

            "<br>2. Hãy mở bằng Chrome." +

            "<br>3. Không nên mở bằng trình duyệt trong Zalo." +

            "<br>4. Điện thoại phải cho phép trang web sử dụng camera." +

            "<br><br>" +

            "Chi tiết: " +
            error.message

        );

    }

}


/*
==================================================
CHỤP ẢNH
==================================================
*/

function chupAnh() {

    if (!stream) {

        hienThiLoi(
            "❌ Camera chưa sẵn sàng!"
        );

        return;

    }


    if (
        camera.videoWidth <= 0 ||
        camera.videoHeight <= 0
    ) {

        hienThiLoi(
            "❌ Camera chưa có hình ảnh. " +
            "Vui lòng chờ vài giây rồi thử lại."
        );

        return;

    }


    try {

        /*
        ============================================
        TẠO CANVAS
        ============================================
        */

        var canvas =
            document.createElement("canvas");


        var width =
            camera.videoWidth;


        var height =
            camera.videoHeight;


        /*
        ============================================
        GIẢM KÍCH THƯỚC ẢNH
        ĐỂ GỬI NHANH HƠN
        ============================================
        */

        var maxWidth = 900;


        if (width > maxWidth) {

            height =
                Math.round(
                    height *
                    maxWidth /
                    width
                );

            width =
                maxWidth;

        }


        canvas.width =
            width;

        canvas.height =
            height;


        var ctx =
            canvas.getContext("2d");


        /*
        ============================================
        KHÔNG LẬT ẢNH KHI LƯU
        ============================================
        */

        ctx.drawImage(

            camera,

            0,
            0,

            width,
            height

        );


        /*
        ============================================
        CHUYỂN JPEG
        ============================================
        */

        anhBase64 =
            canvas.toDataURL(
                "image/jpeg",
                0.60
            );


        if (!anhBase64) {

            throw new Error(
                "Không tạo được ảnh."
            );

        }


        /*
        ============================================
        HIỂN THỊ PREVIEW
        ============================================
        */

        anhPreview.src =
            anhBase64;


        anhPreview.style.display =
            "block";


        camera.style.display =
            "none";


        btnChup.style.display =
            "none";


        btnChupLai.style.display =
            "block";


        btnGui.style.display =
            "block";


        trangThai.innerHTML =
            "✅ Đã chụp ảnh. " +
            "Nếu ảnh rõ, bấm XÁC NHẬN ĐIỂM DANH.";


        /*
        ============================================
        DỪNG CAMERA
        ============================================
        */

        dungCamera();

    }

    catch (error) {

        console.error(error);

        hienThiLoi(
            "❌ Không thể chụp ảnh: " +
            error.message
        );

    }

}


/*
==================================================
CHỤP LẠI
==================================================
*/

function chupLai() {

    anhBase64 =
        null;


    anhPreview.src =
        "";


    anhPreview.style.display =
        "none";


    camera.style.display =
        "block";


    btnChup.style.display =
        "block";


    btnChupLai.style.display =
        "none";


    btnGui.style.display =
        "none";


    trangThai.innerHTML =
        "📷 Đang mở lại camera...";


    moCamera();

}


/*
==================================================
DỪNG CAMERA
==================================================
*/

function dungCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

        stream =
            null;

    }

}


/*
==================================================
GỬI ẢNH
==================================================
*/

function guiAnh() {

    if (daGui) {

        return;

    }


    if (!anhBase64) {

        hienThiLoi(
            "❌ Chưa có ảnh!"
        );

        return;

    }


    if (!id || !token) {

        hienThiLoi(
            "❌ Thiếu thông tin xác thực!"
        );

        return;

    }


    daGui = true;


    btnGui.disabled =
        true;

    btnChupLai.disabled =
        true;


    trangThai.innerHTML =

        "⏳ Đang gửi ảnh..." +

        "<br>" +

        "Vui lòng không đóng trang.";


    /*
    ================================================
    GÁN DỮ LIỆU VÀO FORM
    ================================================
    */

    inputId.value =
        id;


    inputToken.value =
        token;


    inputAnh.value =
        anhBase64;


    /*
    ================================================
    SUBMIT FORM
    KHÔNG DÙNG FETCH
    => TRÁNH CORS
    ================================================
    */

    document
        .getElementById("formGuiAnh")
        .action =
        SCRIPT_URL;


    document
        .getElementById("formGuiAnh")
        .submit();


    /*
    ================================================
    CHỜ APPS SCRIPT GHI SHEET
    ================================================
    */

    setTimeout(
        kiemTraKetQua,
        1200
    );

}


/*
==================================================
KIỂM TRA KẾT QUẢ BẰNG JSONP
==================================================
*/

function kiemTraKetQua() {

    if (!id || !token) {

        return;

    }


    var callbackName =
        "kiemTra_" +
        Date.now();


    window[callbackName] =
        function(result) {

            console.log(
                "Kết quả:",
                result
            );


            if (
                result.status ==
                "DA_DIEM_DANH"
            ) {

                trangThai.innerHTML =

                    "<div class='thanhCong'>" +

                    "🎉 ĐIỂM DANH THÀNH CÔNG!" +

                    "<br><br>" +

                    "Mã đại biểu: " +
                    id +

                    "<br>" +

                    "Thời gian: " +
                    (
                        result.thoiGian ||
                        ""
                    ) +

                    "</div>";


                btnGui.style.display =
                    "none";


                btnChupLai.style.display =
                    "none";


                anhPreview.style.display =
                    "block";


                daGui = true;


                xoaScript(callbackName);


                return;

            }


            if (
                result.status ==
                "DANG_CHO"
            ) {

                trangThai.innerHTML =

                    "⏳ Đang lưu ảnh..." +
                    "<br>" +
                    "Vui lòng chờ...";


                xoaScript(callbackName);


                setTimeout(
                    kiemTraKetQua,
                    1000
                );


                return;

            }


            if (
                result.status ==
                "TOKEN_HET_HAN"
            ) {

                hienThiLoi(
                    "❌ Phiên điểm danh đã hết hạn. " +
                    "Vui lòng quét QR lại."
                );


                xoaScript(callbackName);

                return;

            }


            if (
                result.status ==
                "TOKEN_KHONG_HOP_LE"
            ) {

                hienThiLoi(
                    "❌ Mã xác thực không hợp lệ. " +
                    "Vui lòng quét QR lại."
                );


                xoaScript(callbackName);

                return;

            }


            xoaScript(callbackName);

        };


    var script =
        document.createElement("script");


    script.src =
        SCRIPT_URL +
        "?action=status" +
        "&id=" +
        encodeURIComponent(id) +
        "&token=" +
        encodeURIComponent(token) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            xoaScript(
                callbackName
            );

            /*
            Thử lại
            */

            setTimeout(
                kiemTraKetQua,
                1500
            );

        };


    document
        .body
        .appendChild(script);

}


/*
==================================================
XÓA JSONP SCRIPT
==================================================
*/

function xoaScript(callbackName) {

    try {

        delete window[callbackName];

    }
    catch (e) {}


}


/*
==================================================
HIỂN THỊ LỖI
==================================================
*/

function hienThiLoi(message) {

    trangThai.innerHTML =

        "<div class='loi'>" +

        message +

        "</div>";

}


/*
==================================================
KHI ĐÓNG TRANG
==================================================
*/

window.addEventListener(
    "beforeunload",
    function() {

        dungCamera();

    }
);

</script>


</body>

</html>
