<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Điểm danh hội nghị</title>

<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;

    padding:15px;

    background:#eef3f8;

    font-family:Arial,sans-serif;

}

.box {

    width:100%;

    max-width:650px;

    margin:auto;

    background:white;

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);

}

h1 {

    text-align:center;

    color:#1565c0;

}

#ma {

    text-align:center;

    color:#666;

    margin-bottom:15px;

}

#huongDan {

    background:#fff3cd;

    padding:15px;

    border-radius:10px;

    margin-bottom:15px;

    line-height:1.5;

}

video {

    width:100%;

    border-radius:15px;

    background:#111;

    display:block;

    transform:scaleX(-1);

}

#anh {

    width:100%;

    border-radius:15px;

    display:none;

}

button {

    width:100%;

    padding:16px;

    margin-top:12px;

    border:0;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

}

#btnMo {

    background:#1565c0;

    color:white;

}

#btnChup {

    background:#1565c0;

    color:white;

}

#btnLai {

    background:#777;

    color:white;

    display:none;

}

#btnGui {

    background:#16803c;

    color:white;

    display:none;

}

button:disabled {

    background:#999;

}

#trangThai {

    text-align:center;

    margin-top:15px;

    line-height:1.6;

}

.ok {

    color:#16803c;

    font-weight:bold;

}

.loi {

    color:#d00000;

    font-weight:bold;

}

#khungGui {

    display:none;

}

</style>

</head>

<body>


<div class="box">


<h1>
📋 ĐIỂM DANH HỘI NGHỊ
</h1>


<div id="ma">
Đang tải...
</div>


<div id="huongDan">

📱 <b>Nếu dùng điện thoại:</b>

<br>

Nếu đang mở trang này trong Zalo,

hãy bấm mở bằng

<b>Chrome</b>

để sử dụng camera.

</div>


<!-- CAMERA -->

<video
id="camera"
autoplay
playsinline
muted>
</video>


<!-- ẢNH -->

<img
id="anh"
alt="Ảnh điểm danh">


<!-- NÚT MỞ CAMERA -->

<button
id="btnMo"
onclick="moCamera()">

📷 MỞ CAMERA

</button>


<!-- NÚT CHỤP -->

<button
id="btnChup"
onclick="chupAnh()"
style="display:none">

📸 CHỤP ẢNH ĐIỂM DANH

</button>


<!-- CHỤP LẠI -->

<button
id="btnLai"
onclick="chupLai()">

🔄 CHỤP LẠI

</button>


<!-- GỬI -->

<button
id="btnGui"
onclick="guiAnh()">

✅ XÁC NHẬN ĐIỂM DANH

</button>


<div id="trangThai">

Hãy bấm MỞ CAMERA.

</div>


<!-- FORM GỬI -->

<form
id="formGui"
method="POST"
target="khungGui">

<input
type="hidden"
name="id"
id="inputId">

<input
type="hidden"
name="token"
id="inputToken">

<input
type="hidden"
name="anh"
id="inputAnh">

</form>


<iframe
name="khungGui"
id="khungGui">
</iframe>


</div>


<script>


/*
==================================================
APPS SCRIPT
==================================================
*/

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS7bIBeGwpeKxGqGVIef9nG_dEcF-JjoqmfKl3TsCFCJqqz9mAaXADHqEbpQTnINwTGQ/exec";


/*
==================================================
LẤY ID
==================================================
*/

var params =
new URLSearchParams(
window.location.search
);


var id =
params.get("id");


var token =
params.get("token");


document.getElementById("ma")
.innerText =
"Mã đại biểu: " +
(id || "KHÔNG CÓ");


/*
==================================================
BIẾN
==================================================
*/

var camera =
document.getElementById("camera");


var anh =
document.getElementById("anh");


var btnMo =
document.getElementById("btnMo");


var btnChup =
document.getElementById("btnChup");


var btnLai =
document.getElementById("btnLai");


var btnGui =
document.getElementById("btnGui");


var trangThai =
document.getElementById("trangThai");


var stream =
null;


var anhBase64 =
null;


var daGui =
false;


/*
==================================================
KIỂM TRA
==================================================
*/

if (!id) {

    hienThiLoi(
        "❌ Không có mã đại biểu!"
    );

}

else if (!token) {

    hienThiLoi(
        "❌ Không có mã xác thực. " +
        "Vui lòng quét QR lại."
    );

}


/*
==================================================
MỞ CAMERA
==================================================
*/

async function moCamera() {

    try {

        trangThai.innerHTML =
            "⏳ Đang yêu cầu quyền camera...";


        /*
        ==========================================
        KIỂM TRA TRÌNH DUYỆT
        ==========================================
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Trình duyệt này không hỗ trợ camera."
            );

        }


        /*
        ==========================================
        MỞ CAMERA TRƯỚC
        ==========================================
        */

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        camera.srcObject =
            stream;


        await camera.play();


        /*
        ==========================================
        HIỂN THỊ
        ==========================================
        */

        btnMo.style.display =
            "none";


        btnChup.style.display =
            "block";


        trangThai.innerHTML =

            "<span class='ok'>" +

            "🟢 Camera đã sẵn sàng!" +

            "</span>" +

            "<br>" +

            "Nhìn vào camera rồi bấm CHỤP ẢNH.";


    }

    catch(error) {

        console.error(error);


        hienThiLoi(

            "❌ KHÔNG MỞ ĐƯỢC CAMERA" +

            "<br><br>" +

            "Nếu bạn đang mở từ Zalo:" +

            "<br>" +

            "➡️ Hãy chọn " +

            "<b>Mở bằng Chrome</b>" +

            "<br><br>" +

            "Nếu đã dùng Chrome:" +

            "<br>" +

            "➡️ Hãy bấm biểu tượng 🔒 trên thanh địa chỉ" +

            "<br>" +

            "➡️ Camera → Cho phép" +

            "<br><br>" +

            "Chi tiết: " +

            error.message

        );

    }

}


/*
==================================================
CHỤP ẢNH
==================================================
*/

function chupAnh() {

    if (!stream) {

        hienThiLoi(
            "❌ Camera chưa được mở."
        );

        return;

    }


    if (
        camera.videoWidth <= 0 ||
        camera.videoHeight <= 0
    ) {

        hienThiLoi(
            "❌ Camera chưa có hình ảnh. " +
            "Chờ vài giây rồi thử lại."
        );

        return;

    }


    var canvas =
        document.createElement("canvas");


    var width =
        camera.videoWidth;


    var height =
        camera.videoHeight;


    /*
    ================================================
    GIẢM KÍCH THƯỚC
    ================================================
    */

    var maxWidth = 900;


    if (width > maxWidth) {

        height =
            Math.round(
                height *
                maxWidth /
                width
            );

        width =
            maxWidth;

    }


    canvas.width =
        width;

    canvas.height =
        height;


    var ctx =
        canvas.getContext("2d");


    /*
    ================================================
    LƯU ẢNH KHÔNG LẬT
    ================================================
    */

    ctx.drawImage(
        camera,
        0,
        0,
        width,
        height
    );


    /*
    ================================================
    JPEG
    ================================================
    */

    anhBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.60
        );


    if (!anhBase64) {

        hienThiLoi(
            "❌ Không tạo được ảnh."
        );

        return;

    }


    /*
    ================================================
    HIỂN THỊ
    ================================================
    */

    anh.src =
        anhBase64;


    anh.style.display =
        "block";


    camera.style.display =
        "none";


    btnChup.style.display =
        "none";


    btnLai.style.display =
        "block";


    btnGui.style.display =
        "block";


    trangThai.innerHTML =

        "<span class='ok'>" +

        "✅ Đã chụp ảnh thành công." +

        "</span>" +

        "<br>" +

        "Kiểm tra ảnh rồi bấm XÁC NHẬN.";


    dungCamera();

}


/*
==================================================
CHỤP LẠI
==================================================
*/

function chupLai() {

    anhBase64 =
        null;


    anh.style.display =
        "none";


    camera.style.display =
        "block";


    btnLai.style.display =
        "none";


    btnGui.style.display =
        "none";


    btnChup.style.display =
        "block";


    trangThai.innerHTML =
        "📷 Camera đang hoạt động...";


    moCamera();

}


/*
==================================================
GỬI ẢNH
==================================================
*/

function guiAnh() {

    if (daGui) {
        return;
    }


    if (!anhBase64) {

        hienThiLoi(
            "❌ Chưa có ảnh."
        );

        return;

    }


    if (!id || !token) {

        hienThiLoi(
            "❌ Thiếu mã xác thực. " +
            "Vui lòng quét QR lại."
        );

        return;

    }


    daGui =
        true;


    btnGui.disabled =
        true;

    btnLai.disabled =
        true;


    trangThai.innerHTML =

        "⏳ Đang gửi ảnh..." +

        "<br>" +

        "Vui lòng chờ...";


    /*
    ================================================
    ĐƯA DỮ LIỆU VÀO FORM
    ================================================
    */

    document.getElementById(
        "inputId"
    ).value =
        id;


    document.getElementById(
        "inputToken"
    ).value =
        token;


    document.getElementById(
        "inputAnh"
    ).value =
        anhBase64;


    /*
    ================================================
    GỬI ĐẾN APPS SCRIPT
    ================================================
    */

    var form =
        document.getElementById(
            "formGui"
        );


    form.action =
        SCRIPT_URL;


    form.submit();


    /*
    ================================================
    THÔNG BÁO
    ================================================
    */

    setTimeout(function() {

        trangThai.innerHTML =

            "<span class='ok'>" +

            "✅ Đã gửi ảnh điểm danh!" +

            "<br><br>" +

            "Hệ thống đang lưu ảnh vào Google Drive..." +

            "<br>" +

            "Vui lòng kiểm tra Google Sheet." +

            "</span>";


        btnGui.style.display =
            "none";


        btnLai.style.display =
            "none";


    }, 2500);

}


/*
==================================================
DỪNG CAMERA
==================================================
*/

function dungCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });


        stream =
            null;

    }

}


/*
==================================================
LỖI
==================================================
*/

function hienThiLoi(message) {

    trangThai.innerHTML =

        "<div class='loi'>" +

        message +

        "</div>";

}


/*
==================================================
ĐÓNG TRANG
==================================================
*/

window.addEventListener(
    "beforeunload",
    function() {

        dungCamera();

    }
);

</script>

</body>

</html>
