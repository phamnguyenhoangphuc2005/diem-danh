<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Camera điểm danh Hưng Long</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    font-family: Arial, sans-serif;

    background: #f2f4f7;

    text-align: center;

}

.container {

    max-width: 550px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 20px;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.15);

}

h1 {

    color: #1565c0;

    margin-bottom: 10px;

}

#thongTin {

    font-size: 18px;

    margin-bottom: 15px;

}

.cameraBox {

    width: 100%;

    background: black;

    border-radius: 15px;

    overflow: hidden;

}

video {

    width: 100%;

    display: block;

    transform: scaleX(-1);

}

canvas {

    display: none;

}

button {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background: #e53935;

}

button:disabled {

    background: #999;

}

#trangThai {

    margin-top: 15px;

    font-size: 18px;

    font-weight: bold;

}

.thanhCong {

    color: green;

}

.loi {

    color: red;

}

.loading {

    color: #1565c0;

}

#anhDaChup {

    width: 100%;

    margin-top: 15px;

    border-radius: 15px;

    display: none;

}

</style>

</head>


<body>


<div class="container">


<h1>
📋 ĐIỂM DANH HỘI NGHỊ
</h1>


<div id="thongTin">

Đang kiểm tra mã đại biểu...

</div>


<div class="cameraBox">

<video
    id="camera"
    autoplay
    playsinline>
</video>

</div>


<canvas id="canvas"></canvas>


<button
    id="btnChup"
    onclick="chupAnh()"
    disabled>

📸 CHỤP ẢNH ĐIỂM DANH

</button>


<img
    id="anhDaChup">


<div id="trangThai">

📷 Đang mở camera...

</div>


</div>


<script>


/*
====================================================
 CẤU HÌNH
====================================================
*/


var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS7bIBeGwpeKxGqGVIef9nG_dEcF-JjoqmfKl3TsCFCJqqz9mAaXADHqEbpQTnINwTGQ/exec";


var camera =
document.getElementById("camera");


var canvas =
document.getElementById("canvas");


var btnChup =
document.getElementById("btnChup");


var trangThai =
document.getElementById("trangThai");


var thongTin =
document.getElementById("thongTin");


var anhDaChup =
document.getElementById("anhDaChup");


var stream = null;


/*
====================================================
 LẤY ID TỪ URL
====================================================
*/

var thamSo =
new URLSearchParams(
    window.location.search
);


var id =
thamSo.get("id");


/*
====================================================
 KIỂM TRA ID
====================================================
*/

if (!id) {

    thongTin.innerHTML =
        "<span class='loi'>" +
        "❌ Không có mã đại biểu!" +
        "</span>";

    trangThai.innerHTML = "";

}

else {

    thongTin.innerHTML =
        "Mã đại biểu: <b>" +
        id +
        "</b>";

    moCamera();

}


/*
====================================================
 MỞ CAMERA
====================================================
*/

async function moCamera() {

    try {


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );

        }


        /*
        CAMERA TRƯỚC
        */

        stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        });


        camera.srcObject = stream;


        trangThai.innerHTML =
            "<span class='thanhCong'>" +
            "🟢 CAMERA ĐÃ BẬT" +
            "</span><br>" +
            "Vui lòng nhìn thẳng vào camera.";


        btnChup.disabled = false;


    }

    catch (error) {


        console.error(error);


        trangThai.innerHTML =
            "<span class='loi'>" +

            "❌ KHÔNG THỂ MỞ CAMERA" +

            "</span><br><br>" +

            "Hãy cấp quyền camera cho trình duyệt.";

    }

}


/*
====================================================
 CHỤP ẢNH
====================================================
*/

function chupAnh() {


    if (!stream) {

        return;

    }


    btnChup.disabled = true;


    trangThai.innerHTML =
        "<span class='loading'>" +
        "⏳ Đang chụp ảnh..." +
        "</span>";


    /*
    Kích thước ảnh
    */

    var maxWidth = 1200;


    var width =
        camera.videoWidth;


    var height =
        camera.videoHeight;


    if (width > maxWidth) {

        height =
            height *
            (maxWidth / width);

        width =
            maxWidth;

    }


    canvas.width =
        width;

    canvas.height =
        height;


    var context =
        canvas.getContext("2d");


    /*
    Lật ảnh lại cho đúng
    */

    context.translate(
        width,
        0
    );

    context.scale(
        -1,
        1
    );


    context.drawImage(

        camera,

        0,

        0,

        width,

        height

    );


    /*
    Chuyển thành JPEG
    */

    var anhBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.7
        );


    /*
    Hiển thị ảnh vừa chụp
    */

    anhDaChup.src =
        anhBase64;

    anhDaChup.style.display =
        "block";


    /*
    Tắt camera
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

    }


    /*
    GỬI ẢNH VỀ APPS SCRIPT
    */

    guiAnhVeAppsScript(
        id,
        anhBase64
    );

}


/*
====================================================
 GỬI ẢNH
====================================================
*/

function guiAnhVeAppsScript(
    id,
    anhBase64
) {


    trangThai.innerHTML =
        "<span class='loading'>" +

        "⏳ Đang lưu ảnh và điểm danh..." +

        "</span>";


    /*
    Dùng POST
    */

    fetch(
        SCRIPT_URL,
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body:

                "id=" +
                encodeURIComponent(id) +

                "&anh=" +
                encodeURIComponent(anhBase64)

        }

    )

    .then(function(response) {

        return response.text();

    })

    .then(function(result) {


        console.log(
            "Kết quả Apps Script:",
            result
        );


        if (
            result.trim() == "OK"
        ) {


            trangThai.innerHTML =

                "<span class='thanhCong'>" +

                "✅ ĐIỂM DANH THÀNH CÔNG" +

                "</span><br><br>" +

                "Ảnh đã được lưu.";


            btnChup.style.display =
                "none";


        }

        else {


            trangThai.innerHTML =

                "<span class='loi'>" +

                "❌ " +

                result +

                "</span>";


            btnChup.disabled =
                false;

        }


    })

    .catch(function(error) {


        console.error(error);


        trangThai.innerHTML =

            "<span class='loi'>" +

            "❌ Không thể gửi ảnh về hệ thống." +

            "</span>";


        btnChup.disabled =
            false;

    });

}


</script>


</body>

</html>
